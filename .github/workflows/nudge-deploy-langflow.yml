# Nudge Labs Langflow deployment.
#
# Pushes to the deployment branch build the image, show what would change, and
# then wait on the `production` environment's required reviewer before anything
# reaches AWS. There are no AWS access keys: both jobs mint short-lived
# credentials over GitHub's OIDC provider, and the deploy role trusts only the
# environment subject, so approval cannot be skipped by editing the workflow.
#
# The roles live in infra/lib/cicd-stack.ts and are deployed from a workstation
# (`npx cdk deploy Langflow-prod-Cicd`), never by this pipeline.
name: Deploy Langflow (Nudge Labs)

on:
  push:
    branches: [feature/prod-nl-iac]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:
    inputs:
      environment:
        description: CDK environment to deploy
        type: choice
        options: [prod]
        default: prod

concurrency:
  # Never let two deployments race for the same CloudFormation stacks. Queue
  # instead of cancelling: a cancelled cdk deploy leaves a stack mid-update.
  group: langflow-prod-deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

# Actions are pinned to commit SHAs, not tags. A tag can be repointed at new
# code; this job holds credentials that can deploy anything CloudFormation can
# build, so an action it runs must be exactly the reviewed revision. The trailing
# comment is the human-readable version — keep the two in step when bumping.
env:
  AWS_REGION: eu-central-1
  CDK_ENV: prod
  NODE_VERSION: "24"

jobs:
  validate:
    name: Type check and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

  diff:
    name: Diff against deployed stacks
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - run: npm ci

      - name: Assume the read-only diff role
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: arn:aws:iam::447237717633:role/langflow-prod-github-diff
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: langflow-diff-${{ github.run_id }}

      - name: cdk diff
        id: diff
        run: |
          set -o pipefail
          # Asset hashes are computed from the source tree, so this needs no
          # Docker build. On the first run every stack reads as new.
          npx cdk diff --all -c env=$CDK_ENV 2>&1 | tee diff.txt

      - name: Publish the diff to the run summary
        if: always()
        run: |
          {
            echo '## cdk diff'
            echo '```'
            # The summary has a 1 MiB budget; a full first-run diff exceeds it.
            head -c 900000 diff.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy to production
    needs: diff
    # Gates on the required reviewer, and is what makes the deploy role's trust
    # policy match. Without it the OIDC subject is the branch ref and STS refuses.
    environment:
      name: production
      url: https://langflow.nudge-platforms.com
    # Native aarch64: the task definition runs ARM64, and emulating that build
    # on an x86 runner turns ~25 minutes into hours.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - run: npm ci

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Assume the deploy role
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: arn:aws:iam::447237717633:role/langflow-prod-github-deploy
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: langflow-deploy-${{ github.run_id }}
          # A cold first deploy builds the image and waits on Aurora.
          role-duration-seconds: 10800

      - name: cdk deploy
        run: |
          # Stacks are named explicitly rather than using --all: the Cicd stack
          # owns this pipeline's own trust policy, and a pipeline that can
          # rewrite that can lock itself out of the account.
          npx cdk deploy \
            Langflow-prod-Network \
            Langflow-prod-Data \
            Langflow-prod-Auth \
            Langflow-prod-Service \
            -c env=$CDK_ENV \
            --require-approval never \
            --progress events \
            --concurrency 2

      # No `aws ecs wait services-stable` here: CloudFormation does not report
      # CREATE_COMPLETE for an ECS service until it reaches steady state, so the
      # wait was redundant — and it failed anyway, because the deploy role holds
      # nothing beyond sts:AssumeRole on the bootstrap roles. Granting it
      # ecs:DescribeServices would have widened that for a duplicate check.
      - name: Smoke test
        run: |
          # Unauthenticated requests must be bounced to Google by the load
          # balancer, never answered by Langflow. A 200 here means the SSO gate
          # is not in front of the app.
          code=$(curl -s -o /dev/null -w '%{http_code}' -L --max-time 30 \
            --max-redirs 0 https://langflow.nudge-platforms.com/ || true)
          echo "unauthenticated GET / -> $code"
          case "$code" in
            302|303|401) echo "SSO gate is in front of the app." ;;
            *) echo "::error::Expected a redirect to Google, got $code"; exit 1 ;;
          esac
